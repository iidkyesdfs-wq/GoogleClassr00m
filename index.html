var searchInput=document.getElementById('searchInput');
var clearBtn=document.getElementById('clearSearchBtn');
var filterChips=document.getElementById('filterChips');
var gameCountSpan=document.getElementById('gameCount');
var playerModal=document.getElementById('playerModal');
var playerGameTitle=document.getElementById('playerGameTitle');
var playerCategory=document.getElementById('playerCategory');
var gameIframe=document.getElementById('gameIframe');
var closePlayerBtn=document.getElementById('closePlayerBtn');
var reloadGameBtn=document.getElementById('reloadGameBtn');
var fullscreenBtn=document.getElementById('fullscreenBtn');

var ytUI=document.getElementById('ytUI');
var ytSearchInput=document.getElementById('ytSearchInput');
var ytSearchBtn=document.getElementById('ytSearchBtn');
var ytResults=document.getElementById('ytResults');
var ytPlayer=document.getElementById('ytPlayer');

var shortsUI=document.getElementById('shortsUI');
var shortsSearchInput=document.getElementById('shortsSearchInput');
var shortsSearchBtn=document.getElementById('shortsSearchBtn');
var shortsFeed=document.getElementById('shortsFeed');

var scUI=document.getElementById('scUI');
var scFilterInput=document.getElementById('scFilterInput');
var scFilterBtn=document.getElementById('scFilterBtn');
var scList=document.getElementById('scList');
var scPlayer=document.getElementById('scPlayer');

var mjUI=document.getElementById('mjUI');
var mjSearchInput=document.getElementById('mjSearchInput');
var mjSearchBtn=document.getElementById('mjSearchBtn');
var mjFrame=document.getElementById('mjFrame');

gameCountSpan.textContent=games.length;

document.addEventListener('click',function(e){
var a=e.target.closest && e.target.closest('a');
if(a && a.target==='_blank'){e.preventDefault();}
},true);

function buildEmbedUrl(url){
if(url==='twitch-auto'){
var parents=['localhost','127.0.0.1','0.0.0.0'];
try{var host=location.hostname||'localhost';if(host&&parents.indexOf(host)===-1)parents.push(host);}catch(e){}
var q='';
parents.forEach(function(p){q+='&parent='+encodeURIComponent(p);});
return 'https://player.twitch.tv/?channel=twitch'+q;
}
return url;
}

function hideAllUIs(){
ytUI.classList.remove('active');
shortsUI.classList.remove('active');
scUI.classList.remove('active');
mjUI.classList.remove('active');
gameIframe.style.display='none';
}

function openGame(g){
activeGame=g;
playerGameTitle.textContent=g.title;
playerCategory.innerHTML='<i class="fas fa-tag"></i> '+g.category;

if(g.mojeek){
hideAllUIs();
mjUI.classList.add('active');
playerModal.classList.add('active');
document.body.style.overflow='hidden';
mjFrame.src='https://www.mojeek.com/';
setTimeout(function(){mjSearchInput.focus();},200);
return;
}
if(g.youtube){
hideAllUIs();
ytUI.classList.add('active');
playerModal.classList.add('active');
document.body.style.overflow='hidden';
ytPlayer.src='https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&rel=0';
setTimeout(function(){ytSearchInput.focus();},200);
return;
}
if(g.shorts){
hideAllUIs();
shortsUI.classList.add('active');
playerModal.classList.add('active');
document.body.style.overflow='hidden';
loadShortsFYP();
return;
}
if(g.soundcloud){
hideAllUIs();
scUI.classList.add('active');
playerModal.classList.add('active');
document.body.style.overflow='hidden';
renderScTracks('');
setTimeout(function(){scFilterInput.focus();},200);
return;
}

hideAllUIs();
gameIframe.style.display='block';
gameIframe.src='about:blank';
setTimeout(function(){gameIframe.src=buildEmbedUrl(g.embedUrl);},30);
playerModal.classList.add('active');
document.body.style.overflow='hidden';
}

function renderGames(){
var filtered=games.filter(function(g){
var mCat=currentCategory==='all'||g.category===currentCategory;
var q=searchQuery.toLowerCase();
var mSearch=searchQuery===''||g.title.toLowerCase().indexOf(q)!==-1||(g.tags&&g.tags.some(function(t){return t.toLowerCase().indexOf(q)!==-1}));
return mCat&&mSearch;
});
if(filtered.length===0){
grid.innerHTML='<div class="no-results"><i class="fas fa-search-minus"></i><span>No sites found.</span></div>';
return;
}
var html='';
filtered.forEach(function(g){
html+='<div class="game-card" data-id="'+g.id+'"><div class="game-thumb"><i class="'+g.icon+'"></i></div><div class="game-info"><h3>'+g.title+'</h3><div class="game-meta"><span class="tag">'+g.category+'</span><i class="fas fa-play-circle play-icon"></i></div></div></div>';
});
grid.innerHTML=html;
document.querySelectorAll('.game-card').forEach(function(c){
c.addEventListener('click',function(){
var id=c.getAttribute('data-id');
var g=games.find(function(x){return x.id===id});
if(g)openGame(g);
});
});
}

function closePlayer(){
playerModal.classList.remove('active');
document.body.style.overflow='';
setTimeout(function(){
if(!playerModal.classList.contains('active')){
gameIframe.src='about:blank';
ytPlayer.src='about:blank';
mjFrame.src='about:blank';
shortsFeed.innerHTML='<div class="shorts-empty">Loading feed...</div>';
hideAllUIs();
gameIframe.style.display='block';
activeGame=null;
}
},300);
}

function reloadGame(){
if(!activeGame)return;
if(activeGame.mojeek){mjFrame.src='https://www.mojeek.com/';return;}
if(activeGame.youtube){
ytPlayer.src='about:blank';
setTimeout(function(){ytPlayer.src='https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&rel=0';},50);
return;
}
if(activeGame.shorts){loadShortsFYP();return;}
if(activeGame.soundcloud){return;}
gameIframe.src='about:blank';
setTimeout(function(){gameIframe.src=buildEmbedUrl(activeGame.embedUrl);},50);
}

function toggleFullscreen(){
var w=document.querySelector('.player-frame-wrapper');
if(!document.fullscreenElement){w.requestFullscreen().catch(function(e){console.log(e)})}else{document.exitFullscreen()}
}

/* ==== Mojeek ==== */
function mjSearch(){
var q=mjSearchInput.value.trim();
if(q===''){mjFrame.src='https://www.mojeek.com/';return;}
mjFrame.src='https://www.mojeek.com/search?q='+encodeURIComponent(q);
}
mjSearchBtn.addEventListener('click',function(e){e.preventDefault();mjSearch();});
mjSearchInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();mjSearch();}});

/* ==== YouTube ==== */
function ytSearch(){
var q=ytSearchInput.value.trim();
if(q==='')return;
ytResults.innerHTML='<div class="yt-loading"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
var url='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q='+encodeURIComponent(q)+'&key='+YT_API_KEY;
fetch(url).then(function(r){return r.json()}).then(function(data){
if(data.error){ytResults.innerHTML='<div class="yt-empty">API error: '+data.error.message+'</div>';return;}
if(!data.items||data.items.length===0){ytResults.innerHTML='<div class="yt-empty">No results.</div>';return;}
var html='';
data.items.forEach(function(item){
var vid=item.id.videoId;if(!vid)return;
var title=item.snippet.title;
var thumb=item.snippet.thumbnails.medium.url;
var channel=item.snippet.channelTitle;
var published=new Date(item.snippet.publishedAt).toLocaleDateString();
html+='<div class="yt-item" data-vid="'+vid+'"><img src="'+thumb+'"><div class="yt-meta"><h4>'+title+'</h4><span>'+channel+' • '+published+'</span></div></div>';
});
ytResults.innerHTML=html;
document.querySelectorAll('.yt-item').forEach(function(el){
el.addEventListener('click',function(){
var vid=el.getAttribute('data-vid');
ytPlayer.src='https://www.youtube.com/embed/'+vid+'?autoplay=1&rel=0';
});
});
}).catch(function(err){ytResults.innerHTML='<div class="yt-empty">Search error: '+err.message+'</div>';});
}
ytSearchBtn.addEventListener('click',function(e){e.preventDefault();ytSearch();});
ytSearchInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();ytSearch();}});

/* ==== Shorts ==== */
function loadShortsFYP(){
shortsFeed.innerHTML='<div class="shorts-empty"><i class="fas fa-spinner fa-spin"></i><br><br>Loading feed...</div>';
var q=encodeURIComponent('shorts viral');
var url='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoDuration=short&maxResults=20&q='+q+'&key='+YT_API_KEY;
fetch(url).then(function(r){return r.json()}).then(function(data){
if(data.error){shortsFeed.innerHTML='<div class="shorts-empty">API error: '+data.error.message+'</div>';return;}
if(!data.items||data.items.length===0){shortsFeed.innerHTML='<div class="shorts-empty">No shorts found.</div>';return;}
renderShorts(data.items);
}).catch(function(err){shortsFeed.innerHTML='<div class="shorts-empty">Error: '+err.message+'</div>';});
}

function renderShorts(items){
var html='';
items.forEach(function(item){
var vid=item.id.videoId;if(!vid)return;
var title=item.snippet.title;
var channel=item.snippet.channelTitle;
html+='<div class="shorts-item"><iframe src="https://www.youtube.com/embed/'+vid+'?autoplay=0&rel=0&loop=1&playlist='+vid+'" allow="autoplay; encrypted-media" allowfullscreen></iframe><div class="shorts-info"><h4>'+title+'</h4><span>@'+channel+'</span></div></div>';
});
shortsFeed.innerHTML=html;
}

shortsSearchBtn.addEventListener('click',function(e){
e.preventDefault();
var q=shortsSearchInput.value.trim();
if(q===''){loadShortsFYP();return;}
shortsFeed.innerHTML='<div class="shorts-empty"><i class="fas fa-spinner fa-spin"></i><br><br>Searching...</div>';
var url='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoDuration=short&maxResults=20&q='+encodeURIComponent(q)+'&key='+YT_API_KEY;
fetch(url).then(function(r){return r.json()}).then(function(data){
if(data.error){shortsFeed.innerHTML='<div class="shorts-empty">API error: '+data.error.message+'</div>';return;}
if(!data.items||data.items.length===0){shortsFeed.innerHTML='<div class="shorts-empty">No results.</div>';return;}
renderShorts(data.items);
}).catch(function(err){shortsFeed.innerHTML='<div class="shorts-empty">Error: '+err.message+'</div>';});
});
shortsSearchInput.addEventListener('keydown',function(e){
if(e.key==='Enter'){e.preventDefault();shortsSearchBtn.click();}
});

/* ==== SoundCloud (fixed track list, client-side filter) ==== */
function renderScTracks(filter){
var f=filter.toLowerCase();
var html='';
scTracks.forEach(function(t){
if(f&&t.title.toLowerCase().indexOf(f)===-1&&t.artist.toLowerCase().indexOf(f)===-1)return;
html+='<div class="sc-track" data-url="'+t.url+'"><div class="sc-play"><i class="fas fa-play"></i></div><div class="sc-meta"><h4>'+t.title+'</h4><span>'+t.artist+'</span></div></div>';
});
if(html===''){html='<div class="yt-empty">No tracks match "'+filter+'".</div>';}
scList.innerHTML=html;
document.querySelectorAll('#scList .sc-track').forEach(function(el){
el.addEventListener('click',function(){
var trackUrl=el.getAttribute('data-url');
scPlayer.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(trackUrl)+'&color=%23ff5500&auto_play=true';
});
});
}
scFilterBtn.addEventListener('click',function(e){e.preventDefault();renderScTracks(scFilterInput.value.trim());});
scFilterInput.addEventListener('input',function(e){renderScTracks(e.target.value.trim());});
scFilterInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();renderScTracks(scFilterInput.value.trim());}});

filterChips.addEventListener('click',function(e){
var chip=e.target.closest('.chip');if(!chip)return;
document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});
chip.classList.add('active');
currentCategory=chip.getAttribute('data-category');
renderGames();
});
searchInput.addEventListener('input',function(e){searchQuery=e.target.value.trim();renderGames();});
clearBtn.addEventListener('click',function(){searchInput.value='';searchQuery='';renderGames();searchInput.focus();});
closePlayerBtn.addEventListener('click',closePlayer);
reloadGameBtn.addEventListener('click',reloadGame);
fullscreenBtn.addEventListener('click',toggleFullscreen);
playerModal.addEventListener('click',function(e){if(e.target===playerModal)closePlayer();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&playerModal.classList.contains('active'))closePlayer();});
renderGames();
})();
</script>
